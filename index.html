<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#00A600" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AgriAfrica AI" />

    <!-- SEO / App Store -->
    <title>AgriAfrica AI — Smart Farming for Africa</title>
    <meta name="description" content="AI-powered agricultural advice for African farmers. Get crop diagnostics, market prices, and expert consultations in 9 languages." />
    <meta name="keywords" content="farming, agriculture, AI, Africa, crops, consultation, market prices" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AgriAfrica AI — Smart Farming for Africa" />
    <meta property="og:description" content="AI-powered agricultural advice for African farmers in 9 languages." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://agriafrica.ai" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AgriAfrica AI — Smart Farming for Africa" />
    <meta name="twitter:description" content="AI-powered agricultural advice for African farmers in 9 languages." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Preconnect to Supabase (performance) -->
    <link rel="preconnect" href="https://supabase.com" crossorigin />

    <style>
      html, body { margin: 0; padding: 0; background: #F0F2F5; overflow: hidden; height: 100%; }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
